<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Delícias da Vovó</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: auto; font-family: Arial, sans-serif; }
        .safe-content { padding: 20px; max-width: 800px; margin: 0 auto; }
        iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 9999; }
    </style>
</head>
<body>

<script>
    // 1. Identifica por onde o usuário entrou
    const currentHost = window.location.hostname;
    // 2. Filtro de Robô simples
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);

    // SE entrar pelo subdomínio METODO e NÃO for robô, mostra a oferta em IFRAME (Mascarado)
    if (currentHost.includes('metodo') && !isBot) {
        document.write('<iframe src="https://protocoloemagrecimentodivino.lovable.app/"></iframe>');
        document.body.style.overflow = 'hidden';
    }
</script>

<div class="safe-content">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Esta é a receita tradicional da família...</p>
    <h3>Ingredientes:</h3>
    <ul>
        <li>3 cenouras médias</li>
        <li>3 ovos</li>
        <li>1 xícara de óleo</li>
    </ul>
</div>

</body>
</html>
