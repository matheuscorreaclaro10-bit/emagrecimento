<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delícias da Vovó</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; background-color: #000; }
        
        /* Criamos uma área que "espreme" o conteúdo para dentro */
        .viewport-fix {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        iframe {
            /* O segredo: forçamos o Iframe a ser 92% da largura da tela */
            /* Isso cria uma margem de segurança que impede o botão de vazar */
            width: 92vw !important; 
            height: 100% !important;
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .safe-content { padding: 20px; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);
    const isMetodo = window.location.hostname.includes('metodo');

    if (isMetodo && !isBot) {
        // Se for humano, carrega o site "espremido" para o botão caber
        document.body.innerHTML = '<div class="viewport-fix"><iframe src="https://protocoloemagrecimentodivino.lovable.app/"></iframe></div>';
    }
</script>

<div class="safe-content">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Receita tradicional da vovó...</p>
</div>

</body>
</html>
